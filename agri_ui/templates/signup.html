<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | AgriChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="{% if user and user.dark_mode %}dark{% endif %}">

<div class="main-card" style="max-width:500px;">
    <h1>Create Account</h1>

    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" required class="message-input"><br><br>

        <input type="email" name="email" placeholder="Email" required class="message-input"><br><br>

        <input type="text" name="phone" placeholder="Phone Number" required class="message-input"><br><br>

        <input type="password" name="password" placeholder="Password" required class="message-input"><br><br>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required class="message-input"><br><br>

        <button class="send-btn" style="width:100%;">Sign Up</button>
    </form>

    {% if error %}
        <p style="color:red; text-align:center; margin-top:10px;">
            {{ error }}
        </p>
    {% endif %}

    {% if success %}
        <p style="color:green; text-align:center; margin-top:10px;">
            {{ success }}
        </p>
    {% endif %}

    <p style="text-align:center; margin-top:20px;">
        Already have an account?
        <a href="/">Login</a>
    </p>
</div>

</body>
</html>
