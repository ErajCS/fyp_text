<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | AgriChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="{% if user and user.dark_mode %}dark{% endif %}">

<div class="page-wrapper">
    <div class="main-card auth-card">

        <h1>Create Account</h1>

        <form method="POST">
            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
                class="message-input"
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
                class="message-input"
            >

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required
                class="message-input"
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
                class="message-input"
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
                class="message-input"
            >

            <button type="submit" class="send-btn auth-btn">
                Create Account
            </button>
        </form>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% endif %}

        {% if success %}
            <p style="color:#16a34a; text-align:center; margin-top:12px;">
                {{ success }}
            </p>
        {% endif %}

        <div class="auth-footer">
            Already have an account?
            <a href="/">Login</a>
        </div>

    </div>
</div>

</body>
</html>
