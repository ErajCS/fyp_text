<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to AgriChat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="{% if user and user.dark_mode %}dark{% endif %}">

    <div class="main-card">
        <header>
            <div class="logo">
                <i class="fas fa-leaf"></i> AgriChat
            </div>
            <nav>
                <ul>
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/chatbot" class="active">AgriChat</a></li>
                    <li><a href="/">Logout</a></li>
                </ul>
            </nav>
        </header>

        <h1>Welcome to AgriChat</h1>

        <div class="chat-section">
            <div class="message-wrapper question">
                <div class="chat-bubble question">
                    My tomato leaves are turning yellow. What could be the problem?
                </div>
            </div>
            <div class="message-wrapper answer">
                <div class="chat-bubble answer">
                    This is often a sign of "Tomato Yellow Leaf Curl Virus".
                </div>
                <button class="audio-btn" onclick="playAudio('This is often a sign of Tomato Yellow Leaf Curl Virus', this)">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>

        <div class="input-area">
            <i class="fas fa-microphone mic-icon"></i>
            <input type="text" class="message-input" placeholder="Ask about your crops...">
            <button class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>

    </div>

    <script>
        const chatBox = document.querySelector(".chat-section");
        const inputField = document.querySelector(".message-input");
        const sendBtn = document.querySelector(".send-btn");

        // 1. ADD MESSAGE FUNCTION
        function addMessage(text, type) {
            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper", type);
            
            // Create the bubble
            const bubble = document.createElement("div");
            bubble.classList.add("chat-bubble", type);
            
            // ⬇️ NEW: Automatically handle LTR/RTL text direction
            bubble.setAttribute("dir", "auto"); 
            
            if (type === 'answer') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerText = text;
            }
            
            wrapper.appendChild(bubble);

            // If it's a BOT answer, add a speaker button
            if (type === 'answer' && text !== "Thinking...") {
                const audioBtn = document.createElement("button");
                audioBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                audioBtn.classList.add("audio-btn");
                
                audioBtn.onclick = function() {
                    // strip HTML tags before reading if needed, or pass raw 'text'
                    // We pass raw 'text' here which works great with the backend cleaner
                    playAudio(text, audioBtn);
                };
                
                wrapper.appendChild(audioBtn);
            }

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 2. PLAY AUDIO FUNCTION
        function playAudio(text, btn) {
            console.log("🔊 Generating audio for:", text.substring(0, 20) + "...");

            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            fetch("/generate_audio", {
                method: "POST",
                body: JSON.stringify({ text: text }),
                headers: { "Content-Type": "application/json" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.audio_url) {
                    console.log("▶ Playing:", data.audio_url);
                    const audio = new Audio(data.audio_url);
                    audio.play().catch(e => console.error("Playback failed:", e));
                    
                    audio.onended = () => {
                        btn.innerHTML = originalIcon;
                        btn.disabled = false;
                    };
                } else {
                    console.error("Server Error:", data.error);
                    alert("Could not generate audio. Check server logs.");
                    btn.innerHTML = originalIcon;
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error("Fetch Error:", error);
                btn.innerHTML = originalIcon;
                btn.disabled = false;
            });
        }

        // 3. SEND MESSAGE FUNCTION
        function sendMessage() {
            const text = inputField.value;
            if (text === "") return;

            addMessage(text, "question");
            inputField.value = ""; 

            // Temporary loading bubble
            const loadingWrapper = document.createElement("div");
            loadingWrapper.classList.add("message-wrapper", "answer");
            loadingWrapper.id = "loading-wrapper";
            
            const loadingBubble = document.createElement("div");
            loadingBubble.classList.add("chat-bubble", "answer");
            loadingBubble.innerText = "Thinking...";
            
            loadingWrapper.appendChild(loadingBubble);
            chatBox.appendChild(loadingWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            fetch("/get_response", {
                method: "POST",
                body: JSON.stringify({ msg: text }),
                headers: { "Content-Type": "application/json" }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("loading-wrapper").remove();
                addMessage(data.response, "answer");
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("loading-wrapper").remove();
                addMessage("Error getting response.", "answer");
            });
        }

        // Event Listeners
        sendBtn.addEventListener("click", sendMessage);
        inputField.addEventListener("keypress", function (e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
