<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | AgriChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="{% if user and user.dark_mode %}dark{% endif %}">

<div class="page-wrapper">
    <div class="main-card auth-card">
        <h1>Login to AgriChat</h1>

        <form method="POST">
            <input type="email" name="email" placeholder="Email" required class="message-input">
            <input type="password" name="password" placeholder="Password" required class="message-input">

            <button class="send-btn auth-btn">Login</button>
        </form>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% endif %}

        <p class="auth-footer">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>
    </div>
</div>

</body>
</html>
